[project]
name = "speech-cpp-haas-ja-reference"
version = "0"
description = "Runs Third Intelligence's Haas-ja speech recognition model to dump reference tensors, and converts its weights to GGUF"
requires-python = ">=3.11,<3.12"
dependencies = [
  # The official inference package, whose prediction network is fla's Kimi Delta Attention; it pins NeMo below 2.8 and
  # fla exactly, and refuses another fla at import.
  "haas-asr @ git+https://github.com/third-intelligence/Haas-ASR.git@acc614f",
  "nemo-toolkit[asr]==2.7.3",
  "flash-linear-attention==0.5.2",
  "torch==2.14.0",
  "numpy",
  "soundfile",
  "gguf",
]

[tool.uv]
package = false
# The overrides of the official repository's uv.lock, without which NeMo 2.7.3 does not restore the model.
override-dependencies = [
  "fsspec[http]>=2026.6.0",
  "hydra-core>=1.3.8",
  "packaging>=26.3",
  "transformers>=5.10.0",
]
